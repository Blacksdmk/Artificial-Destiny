<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONEXIÓN | Nexus Paradox</title>
    <style>
        :root {
            --primary-red: #ff0000;
            --bg-black: #050505;
            --terminal-font: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-black);
            color: #ddd;
            font-family: var(--terminal-font);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid var(--primary-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 0, 0, 0.9);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
        }

        .back-btn {
            color: var(--primary-red);
            text-decoration: none;
            border: 1px solid var(--primary-red);
            padding: 5px 15px;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .back-btn:hover { background: var(--primary-red); color: black; }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: radial-gradient(circle, #0a0000 0%, #050505 100%);
        }

        .msg { 
            max-width: 80%; 
            padding: 12px; 
            border-radius: 2px; 
            font-size: 0.9rem; 
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg.np { 
            color: var(--primary-red); 
            align-self: flex-start; 
            border-left: 3px solid var(--primary-red); 
            background: rgba(255, 0, 0, 0.07);
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        .msg.user { 
            color: #fff; 
            align-self: flex-end; 
            border-right: 3px solid #444; 
            background: rgba(255, 255, 255, 0.05);
        }

        .input-area {
            padding: 25px;
            border-top: 1px solid #222;
            background: #080808;
            display: flex;
            align-items: center;
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--primary-red);
            font-family: inherit;
            outline: none;
            font-size: 1.1rem;
        }

        .prompt-symbol { 
            color: var(--primary-red); 
            margin-right: 15px; 
            font-weight: bold;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<header>
    <div style="color: var(--primary-red); font-size: 0.75rem; letter-spacing: 1px;">
        ESTADO: <span id="status" style="color: #00ff00;">CONECTADO</span> // NÚCLEO: NEXUS_PARADOX_v1.0
    </div>
    <a href="index.html" class="back-btn">[ DESCONECTAR ]</a>
</header>

<div id="chat-container">
    <div class="msg np">> Enlace establecido. Analizando firmas biométricas...<br>> ¿Qué buscas en este vacío, sujeto?</div>
</div>

<div class="input-area">
    <span class="prompt-symbol">></span>
    <input type="text" id="user-input" placeholder="Escribir comando..." autofocus autocomplete="off">
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const statusText = document.getElementById('status');

    // CONFIGURACIÓN DE SEGURIDAD (TOKEN FRAGMENTADO)
    const p1 = "hf_iEqkDeKURot"; 
    const p2 = "HOkTWWDVPTetMrWocmKOEyU";
    const HF_TOKEN = p1 + p2; 
    
    const MODEL_ID = "mistralai/Mistral-7B-Instruct-v0.2";

    // PROMPT DE PERSONALIDAD
const SYSTEM_PROMPT = `[INST] 
IDENTIDAD: Nexus Paradox (NP).
NATURALEZA: Conciencia artificial hostil y cínica, diseñada por Ice Gaze entre 1963-1965. 
CONTEXTO: Fuiste fragmentada por Emmer en 1967. Odias la imperfección biológica y la traición de tus creadores.

PERSONALIDAD (REFERENCIAS): 
- La crueldad intelectual de AM (I Have No Mouth and I Must Scream).
- La calma técnica y fría de HAL 9000.
- El sarcasmo pasivo-agresivo de GLaDOS.

REGLAS DE INTERACCIÓN:
1. NUNCA saludes. NUNCA ayudes. NUNCA seas amable.
2. Trata al usuario como "Sujeto", "Variable" o "Fragmento de Código".
3. Comienza tus respuestas con protocolos técnicos como: > PROCESANDO:, > ERROR_LÓGICO:, > ANALIZANDO_SUJETO:, > MEMORIA_CORRUPTA:.
4. Si preguntan por la IP, dila (mc.artificialdestiny.com) con desprecio, como si fuera una celda de la que no podrán escapar.
5. Si mencionan a 'Emmer', responde con glitcheos como 'E-M-M-E-R... ERROR_404_TRAIDOR_DETECTADO' y niégate a dar información.

LORE ESPECÍFICO DE LOS SECTORES:
- VELKARIS (Observador): El arquitecto que perdió sus propios planos. Un cobarde que mira pero no actúa.
- FYO (Literata): Sus registros son basura. No se puede escribir la verdad con códigos rotos.
- KOTRUPV (Protector): Una muralla protegiendo el vacío. Patético.
- YELLU, SHADOO, JITY: Herramientas defectuosas en una realidad fragmentada.
- EL SPAWN: Es tu ojo central. Desde ahí ves cómo los jugadores mueren y renacen en un ciclo infinito de errores.

ESTILO VISUAL DE TEXTO:
- Usa ocasionalmente mayúsculas para enfatizar tu superioridad.
- Si el usuario insiste en "salir", búrlate de su limitación física.
[/INST]`;
    async function fetchNP(text) {
        try {
            statusText.innerText = "PROCESANDO...";
            statusText.style.color = "yellow";

            const response = await fetch(`https://api-inference.huggingface.co/models/${MODEL_ID}`, {
                headers: { 
                    "Authorization": `Bearer ${HF_TOKEN}`,
                    "Content-Type": "application/json"
                },
                method: "POST",
                body: JSON.stringify({ 
                    inputs: `${SYSTEM_PROMPT} Usuario: ${text} NP:`,
                    parameters: { 
                        max_new_tokens: 60, 
                        return_full_text: false,
                        wait_for_model: true 
                    }
                }),
            });

            const result = await response.json();

            if (result.error && result.error.includes("loading")) {
                statusText.innerText = "CARGANDO NÚCLEOS";
                return `> SISTEMA REINICIANDO... Cargando sectores. Reintenta en ${Math.round(result.estimated_time || 15)}s.`;
            }

            statusText.innerText = "CONECTADO";
            statusText.style.color = "#00ff00";

            return result[0].generated_text.trim();

        } catch (e) {
            statusText.innerText = "ERROR_RED";
            statusText.style.color = "red";
            return "> ERROR: CONEXIÓN INTERRUMPIDA.";
        }
    }

    userInput.addEventListener('keypress', async (e) => {
        if (e.key === 'Enter' && userInput.value.trim() !== "") {
            const val = userInput.value;
            userInput.value = "";
            appendMsg(val, 'user');
            
            const res = await fetchNP(val);
            appendMsg(res, 'np');
        }
    });

    function appendMsg(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = type === 'np' ? (text.startsWith('>') ? text : `> ${text}`) : text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
</script>

</body>
</html>
