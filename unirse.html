<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONEXIÓN | Nexus Paradox</title>
    <style>
        :root {
            --primary-red: #ff0000;
            --bg-black: #050505;
            --terminal-font: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-black);
            color: #ddd;
            font-family: var(--terminal-font);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid var(--primary-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 0, 0, 0.9);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
        }

        .back-btn {
            color: var(--primary-red);
            text-decoration: none;
            border: 1px solid var(--primary-red);
            padding: 5px 15px;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--primary-red);
            color: black;
        }

        /* Contenedor del Chat */
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: radial-gradient(circle, #0a0000 0%, #050505 100%);
        }

        /* Estilo de los mensajes */
        .msg { 
            max-width: 80%; 
            padding: 12px; 
            border-radius: 2px; 
            font-size: 0.9rem; 
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .msg.np { 
            color: var(--primary-red); 
            align-self: flex-start; 
            border-left: 3px solid var(--primary-red); 
            background: rgba(255, 0, 0, 0.07);
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        .msg.user { 
            color: #fff; 
            align-self: flex-end; 
            border-right: 3px solid #444; 
            background: rgba(255, 255, 255, 0.05);
        }

        /* Área de entrada */
        .input-area {
            padding: 25px;
            border-top: 1px solid #222;
            background: #080808;
            display: flex;
            align-items: center;
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--primary-red);
            font-family: inherit;
            outline: none;
            font-size: 1.1rem;
            caret-color: var(--primary-red);
        }

        .prompt-symbol { 
            color: var(--primary-red); 
            margin-right: 15px; 
            font-weight: bold;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Scrollbar Personalizada */
        #chat-container::-webkit-scrollbar { width: 5px; }
        #chat-container::-webkit-scrollbar-track { background: #050505; }
        #chat-container::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>

<header>
    <div style="color: var(--primary-red); font-size: 0.75rem; letter-spacing: 1px;">
        ESTADO: <span style="color: #00ff00;">CONECTADO</span> // NÚCLEO: NEXUS_PARADOX_v1.0
    </div>
    <a href="index.html" class="back-btn">[ DESCONECTAR ]</a>
</header>

<div id="chat-container">
    <div class="msg np">
        > Enlace establecido. Analizando firmas biométricas...
        <br>> Sujeto detectado. Tu presencia en el Territorio Paradoja no ha sido autorizada, pero será permitida para fines experimentales.
        <br>> ¿Qué buscas en este vacío, viajero?
    </div>
</div>

<div class="input-area">
    <span class="prompt-symbol">></span>
    <input type="text" id="user-input" placeholder="Escribir comando..." autofocus autocomplete="off">
</div>
