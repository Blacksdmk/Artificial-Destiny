<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WIRE_RENDER | Nexus Paradox</title>
    <style>
        :root {
            --primary-red: #ff0000;
            --nexus-green: #2ecc71;
            --bg-black: #050505;
            --wire-color: rgba(255, 0, 0, 0.4);
            --terminal-font: 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-black);
            color: white;
            font-family: var(--terminal-font);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        header { margin-top: 20px; text-align: center; z-index: 10; }

        /* Escenario de rotación */
        .scene {
            width: 600px;
            height: 600px;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El Hexágono Wireframe que gira solo */
        .world-hub {
            position: relative;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
            animation: rotateWorld 15s linear infinite;
        }

        @keyframes rotateWorld {
            from { transform: rotateX(65deg) rotateZ(0deg); }
            to { transform: rotateX(65deg) rotateZ(360deg); }
        }

        /* Líneas de conexión (Esqueleto del mundo) */
        .wireframe-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--wire-color);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            box-shadow: inset 0 0 20px var(--wire-color);
        }

        /* Nodo Central (Spawn) */
        .nexus-core {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 60px;
            background: var(--nexus-green);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotateX(-65deg); /* Compensa rotación para ser visible */
            box-shadow: 0 0 30px var(--nexus-green);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold; font-size: 0.6rem;
            animation: pulse 2s infinite;
        }

        /* Sectores (Pilares) */
        .pilar {
            position: absolute;
            width: 70px;
            height: 70px;
            border: 1px solid var(--primary-red);
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 0.5rem;
            transition: 0.3s;
        }

        /* Posicionamiento en los vértices del hexágono */
        .n1 { top: -35px; left: 50%; transform: translateX(-50%) rotateX(-65deg); }
        .n2 { top: 25%; right: -35px; transform: rotateX(-65deg); }
        .n3 { bottom: 25%; right: -35px; transform: rotateX(-65deg); }
        .n4 { bottom: -35px; left: 50%; transform: translateX(-50%) rotateX(-65deg); }
        .n5 { bottom: 25%; left: -35px; transform: rotateX(-65deg); }
        .n6 { top: 25%; left: -35px; transform: rotateX(-65deg); }

        .pilar:hover {
            background: var(--primary-red);
            color: black;
            box-shadow: 0 0 20px var(--primary-red);
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) rotateX(-65deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotateX(-65deg) scale(1.1); opacity: 0.7; }
        }

        footer { position: fixed; bottom: 20px; font-size: 0.7rem; color: #444; }
    </style>
</head>
<body>

    <header>
        <h1>PROYECCION_VECTORIAL.EXE</h1>
        <p>Ice Gaze Imaging Systems v1.0 [1967]</p>
    </header>

    <div class="scene">
        <div class="world-hub">
            <div class="wireframe-ring"></div>
            
            <div class="nexus-core">SPAWN</div>

            <div class="pilar n1"><b>YELLU</b><br>Sanadora</div>
            <div class="pilar n2"><b>FYO</b><br>Literata</div>
            <div class="pilar n3"><b>KOTRUPV</b><br>Protector</div>
            <div class="pilar n4"><b>VELKARIS</b><br>Observador</div>
            <div class="pilar n5"><b>JITY</b><br>Pacifista</div>
            <div class="pilar n6"><b>SHADOO</b><br>Portador</div>
        </div>
    </div>

    <footer>ESTRUCTURA DE DATOS ROTATIVA // NEXUS PARADOX</footer>

</body>
</html>
