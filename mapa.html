<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPA ISOMÉTRICO | Nexus Paradox</title>
    <style>
        :root {
            --primary-red: #ff0000;
            --nexus-green: #2ecc71;
            --bg-black: #050505;
            --terminal-font: 'Courier New', Courier, monospace;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body {
            background-color: var(--bg-black);
            color: white;
            font-family: var(--terminal-font);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
        }

        header {
            margin-top: 20px;
            text-align: center;
            z-index: 100;
        }

        /* Contenedor del Mapa con inclinación 3D */
        .viewport {
            width: 100%;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transform: rotateX(45deg) rotateZ(-15deg);
        }

        .map-grid {
            position: relative;
            width: 500px;
            height: 500px;
            border: 2px solid rgba(255, 0, 0, 0.1);
            background: repeating-linear-gradient(rgba(255,0,0,0.05) 0 1px, transparent 1px 40px),
                        repeating-linear-gradient(90deg, rgba(255,0,0,0.05) 0 1px, transparent 1px 40px);
        }

        /* Spawn - El Ojo Central */
        .nexus-spawn {
            position: absolute;
            top: 50%; left: 50%;
            width: 100px; height: 100px;
            background: radial-gradient(circle, var(--nexus-green) 20%, #001a00 80%);
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%) translateZ(10px);
            box-shadow: 0 0 40px var(--nexus-green);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.8rem;
            text-shadow: 0 0 5px black;
        }

        /* Estructura de las Secciones del Mapa */
        .sector-3d {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(40, 0, 0, 0.8);
            border: 1px solid var(--primary-red);
            transform-style: preserve-3d;
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Efecto de Elevación al pasar el mouse */
        .sector-3d:hover {
            transform: translateZ(50px);
            background: var(--primary-red);
            color: black;
            box-shadow: -10px 10px 20px rgba(0,0,0,0.5), 0 0 15px var(--primary-red);
        }

        .sector-3d h3 { font-size: 0.7rem; margin: 0; pointer-events: none; }
        .sector-3d p { font-size: 0.5rem; margin: 2px 0 0; text-transform: uppercase; pointer-events: none; }

        /* Posicionamiento Geométrico (Hexágono) */
        .yellu { top: 0; left: 50%; transform: translateX(-50%); }
        .fyo { top: 25%; right: 0; }
        .kotrupv { bottom: 25%; right: 0; }
        .velkaris { bottom: 0; left: 50%; transform: translateX(-50%); }
        .jity { bottom: 25%; left: 0; }
        .shadoo { top: 25%; left: 0; }

        footer {
            position: fixed;
            bottom: 20px;
            font-size: 0.7rem;
            color: #444;
            z-index: 100;
        }

        .btn-exit {
            color: var(--primary-red);
            text-decoration: none;
            border: 1px solid var(--primary-red);
            padding: 5px 20px;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .btn-exit:hover { background: var(--primary-red); color: black; }
    </style>
</head>
<body>

    <header>
        <h1>ESQUEMA_TOPOGRAFICO.SYS [3D_RENDER]</h1>
        <p>Ajuste manual de perspectiva habilitado</p>
        <a href="index.html" class="btn-exit">[ SALIR ]</a>
    </header>

    <div class="viewport">
        <div class="map-grid">
            
            <div class="nexus-spawn">SPAWN</div>

            <!-- Nodos Elevables -->
            <div class="sector-3d yellu">
                <h3>SECTOR YELLU</h3>
                <p>Sanadora</p>
            </div>

            <div class="sector-3d fyo">
                <h3>SECTOR FYO</h3>
                <p>Literata</p>
            </div>

            <div class="sector-3d kotrupv">
                <h3>SECTOR KOTRUPV</h3>
                <p>Protector</p>
            </div>

            <div class="sector-3d velkaris">
                <h3>SECTOR VELKARIS</h3>
                <p>Observador</p>
            </div>

            <div class="sector-3d jity">
                <h3>SECTOR JITY</h3>
                <p>Pacifista</p>
            </div>

            <div class="sector-3d shadoo">
                <h3>SECTOR SHADOO</h3>
                <p>Portador</p>
            </div>

        </div>
    </div>

    <footer>
        VISUALIZACIÓN DE ALTA PRIORIDAD // NEXUS PARADOX 2026
    </footer>

</body>
</html>
